x-default-volumes: &default-volumes
  volumes:
    #- ./:/app
    #- node-module:/app/node_module
    - ../naturedb-volumes/bucket:/bucket

services:
  flask:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        PYTHON_VERSION: 3.12
        DEBIAN_RELEASE: bookworm
        PIP_REQUIREMENTS: requirements/base.txt
        NODE_VERSION: 20
    image: naturedb/flask-${WEB_ENV}
    container_name: naturedb-flask-${WEB_ENV}-container

    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=app
      - WEB_ENV=${WEB_ENV}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Google Analytics dashboard summary (see app/helpers_analytics.py)
      - FEATURE_GA_DASHBOARD=${FEATURE_GA_DASHBOARD:-false}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - GA4_CREDENTIALS_PATH=${GA4_CREDENTIALS_PATH:-}
    volumes:
      - .:/code
      - ../naturedb-volumes/bucket:/bucket
      - ../naturedb-volumes/uploads:/uploads
      - ../naturedb-volumes/logs/flask:/var/log/naturedb
      # To enable GA: place the service-account key at the host path below and
      # uncomment. Keep that file OUT of git. (An absent bind source would
      # otherwise be created as an empty directory, so keep it commented until ready.)
      - ../naturedb-volumes/secrets/ga4.json:/run/secrets/ga4.json:ro
    # /srv/start runs `flask migrate` before serving, so postgres has to be
    # accepting connections first -- on a fresh clone its initdb pass takes
    # long enough that an unordered start loses the race and the app comes up
    # against an empty schema. redis backs the stats cache and has no fallback.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: /srv/start

  postgres:
    build:
      context: .
      dockerfile: ./docker/Dockerfile_postgres
      args:
        POSTGRES_VERSION: 16
        DEBIAN_RELEASE: bookworm
    image: naturedb/postgres-${WEB_ENV}
    container_name: naturedb-postgres-${WEB_ENV}-container
    restart: no
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ../naturedb-volumes/pgdata:/var/lib/postgresql/data/pgdata
      - ./initdb:/docker-entrypoint-initdb.d
      - ../naturedb-volumes/bucket:/bucket
    healthcheck:
      # start_period covers the first-boot initdb pass (extensions + any dump).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    #command: ["postgres", "-c", "log_statement=all"]
  redis:
    image: redis:8-alpine
    restart: no
