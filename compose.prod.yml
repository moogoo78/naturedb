services:
  flask:
    build:
      args:
        PIP_REQUIREMENTS: requirements/prod.txt
    expose:
      - 8001
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myapp1.rule=Host(`${PORTAL_HOST}`)"
      - "traefik.http.routers.myapp1.entrypoints=websecure"
      - "traefik.http.routers.myapp1.tls.certresolver=myresolver"
      - "traefik.http.services.flask.loadbalancer.server.port=8001"
    # flask logs: the base compose.yml already mounts
    # ../naturedb-volumes/logs/flask -> /var/log/naturedb (where flask.log is
    # written), so no volume override is needed here. The old
    # `..naturedb-volumes/logs/flask:/app/logs` entry had a missing slash (it
    # created a junk ..naturedb-volumes/ dir) and pointed at an unused path.

  postgres:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../naturedb-volumes/logs/postgres:/var/log/postgresql
      - ./docker/postgresql.conf:/etc/postgresql.conf
      #command: -c config_file=/etc/postgresql.conf
    # Postgres tuning lives here rather than in ALTER SYSTEM, so the repo is the
    # single source of truth and a fresh environment reproduces production.
    # Command-line `-c` outranks both postgresql.conf and postgresql.auto.conf,
    # so these win over whatever initdb left inside the pgdata volume.
    #
    # Do NOT uncomment the config_file line above: pointing config_file at that
    # 3-line file replaces the image's entire default config and drops
    # listen_addresses, which breaks networking.
    #
    # Memory settings are env-driven because this file is shared by production
    # and staging, which are not the same size. Defaults below are the stock
    # PostgreSQL values, so an environment that sets nothing behaves exactly as
    # it does today. Production (8 GiB) sets in its .env:
    #   POSTGRES_SHARED_BUFFERS=2GB
    #   POSTGRES_EFFECTIVE_CACHE_SIZE=6GB
    #   POSTGRES_MAINTENANCE_WORK_MEM=256MB
    # Rule of thumb: shared_buffers ~25% of RAM, effective_cache_size ~75%.
    # Revisit both if the instance is ever resized.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      # Not size-dependent, so pinned for every deployed environment.
      # statement_timeout caps runaway queries (see the Jul 2026 incident); a
      # migration or batch job doing real work must SET statement_timeout = 0
      # for its own session.
      - -c
      - statement_timeout=30s
      # Observability. log_min_duration_statement is what made the Jul 2026
      # index regression diagnosable at all; log_autovacuum_min_duration was
      # 10min by default, which hid every autovacuum run that mattered.
      - -c
      - log_min_duration_statement=5s
      - -c
      - log_autovacuum_min_duration=0
  redis:
    restart: always

  traefik:
    image: traefik:3.6
    restart: always
    # The access log goes to stdout (no --accesslog.filePath) so Docker rotates
    # it. Traefik never rotates a log file it writes itself: the old
    # /logs/access.log grew unbounded to 6.2G and filled the root disk on
    # 2026-11-17, taking postgres down. Hard cap here: 5 x 50m = 250M.
    # Read with `docker compose logs traefik`; note logs go away with the
    # container on `down`.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      # Optional: Explicitly tell LEGO (the underlying library) to follow CNAMEs
      - LEGO_EXPERIMENTAL_CNAME_SUPPORT=true
    command:
      #- "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      #- "--certificatesresolvers.myresolver.acme.tlsChallenge=true"
      #- "--certificatesresolvers.myresolver.acme.httpChallenge.entryPoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=cloudflare"
      #- "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      #- --certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53
      # Use public resolvers to ensure Traefik sees the CNAME quickly
      - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"

      - "--accesslog.bufferingsize=100"
      - "--accesslog.format=json"
      - "--accesslog.addinternals"
      # Everything arrives via CloudFront, so ClientHost is always an edge IP.
      # The real client is the last X-Forwarded-For entry; keep it and the UA
      # so a crawler can be identified (2026-11-26 crawl incident).
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.X-Forwarded-For=keep"
      # Trust X-Forwarded-For only from CloudFront origin-facing ranges
      # (AWS ip-ranges.json, service CLOUDFRONT_ORIGIN_FACING, 2026-11-26).
      # Without this traefik discards the header and every client looks like
      # an edge IP. Refresh when AWS adds ranges.
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=3.29.57.0/26,3.172.0.0/18,3.172.64.0/18,13.124.199.0/24,15.158.0.0/16,18.68.0.0/16,24.110.128.0/17,51.72.40.128/28,51.72.40.144/28,51.72.96.0/23,51.74.20.0/24,51.74.21.0/24,51.74.22.0/24,52.46.0.0/18,52.82.128.0/23,52.82.134.0/23,54.182.128.0/20,54.182.144.0/21,54.182.154.0/23,54.182.156.0/22,54.182.160.0/21,54.182.172.0/22,54.182.176.0/21,54.182.184.0/22,54.182.188.0/23,54.182.224.0/21,54.182.240.0/21,54.182.248.0/22,54.239.134.0/23,54.239.170.0/23,54.239.204.0/22,54.239.208.0/21,64.252.64.0/18,64.252.128.0/18,70.132.0.0/18,130.176.0.0/18,130.176.64.0/21,130.176.72.0/22,130.176.76.0/24,130.176.78.0/23,130.176.80.0/22,130.176.86.0/23,130.176.88.0/21,130.176.96.0/19,130.176.128.0/21,130.176.136.0/23,130.176.140.0/22,130.176.144.0/20,130.176.160.0/19,130.176.192.0/19,204.246.166.0/24,205.251.218.0/24"
      # Per-client rate limit on every HTTPS router (flask, greenhouse, image
      # review). Defined in this container's labels below so it exists as soon
      # as the docker provider loads.
      - "--entrypoints.websecure.http.middlewares=client-ratelimit@docker"
    labels:
      # Keyed on the real client: with the trustedIPs above, the rightmost
      # X-Forwarded-For entry is the address CloudFront saw (depth=1). Keying
      # on the remote address instead would rate-limit CloudFront edges, i.e.
      # everyone at once. Generous for humans (a page load plus assets), tight
      # enough to stop a single scraper hammering 20 s specimen renders.
      - "traefik.http.middlewares.client-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.client-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.client-ratelimit.ratelimit.burst=30"
      - "traefik.http.middlewares.client-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
